name: Publicar Bule na Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bule-hostinger
  cancel-in-progress: false

jobs:
  publicar:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Enviar exportação estática para public_html
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_USER" && test -n "$FTP_PASSWORD"
          test -f out/index.html
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          SSHPASS="$FTP_PASSWORD" timeout 25 sshpass -e ssh -p 65002 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 u810408930@89.117.7.121 pwd
