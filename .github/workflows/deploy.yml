name: Publicar Bule na Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bule-hostinger
  cancel-in-progress: false

jobs:
  publicar:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Enviar exportação estática para public_html
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_HOST" && test -n "$FTP_USER" && test -n "$FTP_PASSWORD"
          test -f out/index.html
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          timeout 120 lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://89.117.7.121" -e '
            set cmd:fail-exit yes
            set ftp:ssl-force yes
            set ftp:ssl-protect-data yes
            set ssl:verify-certificate yes
            set ssl:check-hostname no
            set net:timeout 15
            set net:max-retries 1
            cd public_html
            mirror --reverse --parallel=4 out/ .
            bye
          '
